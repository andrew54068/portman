<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>portman: owns every port on your Mac</title>
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#060a1a"/>
    </linearGradient>
    <radialGradient id="b-glow" cx="0.22" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2f4bb0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f4bb0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="b-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.7" fill="#9fb3ff" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="b-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.25" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="b-dots-mask">
      <rect width="1280" height="640" fill="url(#b-fade)"/>
    </mask>
    <filter id="b-tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <!-- icon (same drawing as icon.svg, ids prefixed) -->
    <linearGradient id="i-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2d66"/>
      <stop offset="1" stop-color="#0a1230"/>
    </linearGradient>
    <radialGradient id="i-glow" cx="0.58" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#3552b8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3552b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="i-neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="i-prong" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="0.5" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <clipPath id="i-tile">
      <rect width="1024" height="1024" rx="230"/>
    </clipPath>
    <filter id="i-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#b-bg)"/>
  <rect width="1280" height="640" fill="url(#b-glow)"/>
  <rect width="1280" height="640" fill="url(#b-dots)" mask="url(#b-dots-mask)"/>

  <svg x="96" y="150" width="360" height="360" viewBox="0 0 1024 1024" filter="url(#b-tile-shadow)" overflow="visible">
    <g clip-path="url(#i-tile)">
      <rect width="1024" height="1024" fill="url(#i-bg)"/>
      <rect width="1024" height="1024" fill="url(#i-glow)"/>
      <path d="M420 610 C350 680 250 650 215 740 C180 830 290 880 250 980 C235 1020 200 1050 170 1090"
            fill="none" stroke="#b45309" stroke-width="78" stroke-linecap="round" filter="url(#i-shadow)"/>
      <path d="M420 610 C350 680 250 650 215 740 C180 830 290 880 250 980 C235 1020 200 1050 170 1090"
            fill="none" stroke="#f59e0b" stroke-width="58" stroke-linecap="round"/>
      <g transform="translate(575 455) rotate(45)" filter="url(#i-shadow)">
        <rect x="-122" y="-345" width="68" height="215" rx="24" fill="url(#i-prong)"/>
        <rect x="54" y="-345" width="68" height="215" rx="24" fill="url(#i-prong)"/>
        <circle cx="-88" cy="-290" r="15" fill="#0a1230" opacity="0.55"/>
        <circle cx="88" cy="-290" r="15" fill="#0a1230" opacity="0.55"/>
        <path d="M-150 -170 H150 Q200 -170 198 -120 L188 20 Q184 70 140 92 Q100 112 90 132 L82 160 H-82 L-90 132 Q-100 112 -140 92 Q-184 70 -188 20 L-198 -120 Q-200 -170 -150 -170 Z"
              fill="url(#i-body)"/>
        <path d="M-150 -170 H150 Q200 -170 198 -120 L196 -96 Q20 -128 -197 -96 L-198 -120 Q-200 -170 -150 -170 Z"
              fill="#fff7d6" opacity="0.55"/>
        <rect x="-128" y="-30" width="256" height="20" rx="10" fill="#b45309" opacity="0.35"/>
        <rect x="-118" y="18" width="236" height="20" rx="10" fill="#b45309" opacity="0.35"/>
        <path d="M-82 156 H82 V225 Q82 255 52 255 H-52 Q-82 255 -82 225 Z" fill="url(#i-neck)"/>
        <rect x="-82" y="185" width="164" height="14" fill="#92400e" opacity="0.35"/>
        <rect x="-82" y="215" width="164" height="14" fill="#92400e" opacity="0.35"/>
      </g>
      <g stroke="#fde68a" stroke-width="22" stroke-linecap="round">
        <path d="M842 150 L884 108"/>
        <path d="M880 222 L940 206"/>
        <path d="M770 112 L786 54"/>
      </g>
      <rect width="1024" height="1024" rx="230" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="8"/>
    </g>
  </svg>

  <g font-family="'Avenir Next', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="520" y="240" font-size="132" font-weight="800" fill="#f8fafc" letter-spacing="-2">portman</text>
    <text x="524" y="316" font-size="40" font-weight="600" fill="#cbd5e1">Owns every port on your Mac.</text>
    <text x="525" y="364" font-size="25" font-weight="500" fill="#8b9bc4">List · reserve · block collisions · stop safely</text>
  </g>

  <g transform="translate(520 398)">
    <rect width="660" height="118" rx="18" fill="#050917" fill-opacity="0.85" stroke="#26356e" stroke-width="2"/>
    <circle cx="28" cy="24" r="6" fill="#f87171"/>
    <circle cx="48" cy="24" r="6" fill="#fbbf24"/>
    <circle cx="68" cy="24" r="6" fill="#4ade80"/>
    <g font-family="Menlo, 'SF Mono', ui-monospace, Consolas, monospace" font-size="24">
      <text x="28" y="70" xml:space="preserve"><tspan fill="#fbbf24">$</tspan><tspan fill="#e2e8f0"> portman run blog -- vite --port </tspan><tspan fill="#fbbf24">{port}</tspan></text>
      <text x="28" y="102" fill="#86efac">blog → http://my-mac:8800</text>
    </g>
  </g>
</svg>
